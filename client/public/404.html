<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoAssist — Motorcycle Roadside Assistance</title>
    <script>
      // GitHub Pages SPA HashRouter fallback
      (function() {
        var base = '/BIKER/';
        var path = window.location.pathname;
        if (path.indexOf(base) === 0) {
          var route = path.substring(base.length);
          if (route && route !== 'index.html') {
            window.location.replace(
              window.location.origin + base + '#/' + route.replace(/^\/+/, '') + window.location.search + window.location.hash
            );
            return;
          }
        }
        window.location.replace(window.location.origin + base + window.location.search + window.location.hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        background-color: #090A08;
        color: #EFF2F7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 241, 116, 0.2);
        border-top-color: #FFF174;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p>Connecting to MotoAssist Roadside Network...</p>
  </body>
</html>
